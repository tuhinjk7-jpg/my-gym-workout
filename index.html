<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f8fafc}.hero{background:#111827;color:#fff;padding:25px 20px 22px;border-radius:0 0 26px 26px}
.hero small{opacity:.7;font-weight:700}.hero h1{margin:6px 0;font-size:27px}.hero p{margin:5px 0;opacity:.75}
.progress{margin-top:17px;height:9px;background:#374151;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#22c55e}
.progressText{margin-top:8px;font-size:13px;opacity:.8}.days{display:flex;gap:8px;padding:16px;overflow:auto}
.day{border:0;background:#fff;padding:10px 15px;border-radius:14px;font-weight:800;box-shadow:0 2px 8px #0001}.day.active{background:#111827;color:#fff}
.content{padding:0 16px 28px}.card{background:#fff;border-radius:20px;margin:12px 0;padding:12px;display:flex;gap:13px;align-items:center;box-shadow:0 3px 14px #00000010;border:2px solid transparent}
.card.done{border-color:#86efac;background:#f0fdf4}.card.notdone{border-color:#fecaca;background:#fff5f5}
.pic{width:92px;height:92px;min-width:92px;border-radius:16px;object-fit:cover;background:#e5e7eb;display:block}
.info{flex:1}.num{font-size:12px;color:#6b7280;font-weight:800}.name{font-size:17px;font-weight:800;margin:3px 0}.meta{font-size:13px;color:#6b7280}
.actions{display:flex;gap:6px;margin-top:9px}.btn{border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px}
.doneBtn{background:#dcfce7;color:#166534}.noBtn{background:#fee2e2;color:#991b1b}.reset{width:100%;border:0;border-radius:15px;padding:13px;background:#e5e7eb;font-weight:800;margin-top:8px}

const days=["Sunday","Monday","Tuesday","Wednesday","Thursday"];
let d=new Date().getDay(); let selectedDay=(d>=0&&d<=4)?d:0;
function key(){return "gym_"+days[selectedDay]}
function state(){try{return JSON.parse(localStorage.getItem(key())||"[]")}catch(e){return []}}
function render(){
 const st=state(),done=st.filter(x=>x==="done").length;
 document.getElementById("days").innerHTML=days.map((x,i)=>'<button class="day '+(i===selectedDay?'active':'')+'" onclick="selectedDay='+i+';render()">'+x.slice(0,3)+'</button>').join("");
 document.getElementById("subtitle").textContent=days[selectedDay]+" • 9 exercises";
 document.getElementById("progressText").textContent=done+" / 9 completed";
 document.getElementById("bar").style.width=(done/9*100)+"%";
 document.getElementById("list").innerHTML=exercises.map((e,i)=>{
  let v=st[i]||"",c=v==="done"?"done":v==="notdone"?"notdone":"";
  return '<div class="card '+c+'"><img class="pic" src="'+e[2]+'" alt="'+e[0]+'"><div class="info"><div class="num">STEP '+(i+1)+'</div><div class="name">'+e[0]+'</div><div class="meta">'+e[1]+'</div><div class="actions"><button class="btn doneBtn" onclick="mark('+i+',\'done\')">✓ DONE</button><button class="btn noBtn" onclick="mark('+i+',\'notdone\')">NOT DONE</button></div></div></div>'
 }).join("");
}
function mark(i,v){let s=state();s[i]=v;localStorage.setItem(key(),JSON.stringify(s));render()}
function resetDay(){if(confirm("Reset this day's checklist?")){localStorage.removeItem(key());render()}}
render();
</script>
